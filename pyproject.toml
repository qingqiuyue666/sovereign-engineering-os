[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-engineering-os"
version = "0.0.0"
description = "Local-first AI/VFX production assistant with controlled execution evidence."
requires-python = ">=3.13"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.scripts]
seos = "apps.operator_cli.main:main"
seos-local = "kernel.personal_ai.local_mvp_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "kernel*", "tools*", "creative*"]
namespaces = true
