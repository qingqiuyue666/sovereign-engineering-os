package: replay_claim_taxonomy
status: design_only
authorizes_implementation: false
constitution_changes: none
implementation_foundation_changes: none
new_at_ids: none
new_inv_ids: none
schema_changes: none
contract_changes: none
receipt_shape_changes: none
runtime_module_changes: none

baseline_refs:
  - governance/constitution/sovereign_engineering_operating_system_master_plan_v11.txt
  - governance/implementation/v11_narrow_path_implementation_foundation.md
  - governance/design/phase2_substrate/
  - governance/design/phase2_promotion_gate/
  - governance/design/external_execution_admission_boundary/
  - kernel/replay/replay_classifier.py
  - kernel/schemas/replay_anchor.schema.json

permitted_claim_classes:
  - exact
  - diagnostic
  - semantic
  - degraded
  - unreplayable

closure:
  size: 5
  source_of_truth:
    - kernel/schemas/replay_anchor.schema.json (replay_class_claim.enum)
    - kernel/replay/replay_classifier.py (ReplayClass enum)
  new_class_additions_in_this_package: none
  renames_in_this_package: none
  reorderings_in_this_package: none

scope_in:
  - exact_claim_class_set
  - per_class_definitions
  - per_class_admission_evidence
  - downgrade_paths_between_classes
  - automatic_lowering_conditions
  - relationship_to_replay_classifier
  - relationship_to_replay_anchor
  - relationship_to_evidence_service
  - relationship_to_audit_binding
  - relationship_to_external_execution_admission_boundary
  - forbidden_claims_and_invalid_combinations
  - unresolved_blockers_vs_recorded_risks
  - review_readiness_statement

scope_out:
  - production_runtime_code
  - kernel_module_changes
  - schema_or_contract_or_receipt_shape_changes
  - test_changes
  - ui_dashboards_project_shell
  - plugins_extensions
  - distributed_execution_runtime
  - multi_vendor_routing_breadth
  - release_packaging_notarization_breadth
  - new_constitutional_rules
  - new_at_or_inv_identifiers
  - new_design_directories_outside_this_package

