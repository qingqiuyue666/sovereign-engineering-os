name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  canonical-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Show Python version
        run: python --version
      - name: Run canonical health gate
        run: make ci
