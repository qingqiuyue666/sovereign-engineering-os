boundary_rule:
  governing_sections: [3.1, 3.11, 27, 31]
  default: deny
  scope: per_call_per_executor
  silence_is_not_admission: true
  rule: |
    No call, byte, or signal crosses the host/executor boundary unless
    an explicit rule in this package admits it. No future executor —
    of any substrate shape (Wasmtime/WASI, Apple Virtualization.framework,
    Linux/KVM sidecar or remote worker, or APFS clonefile-backed
    phantom workspace) — may acquire any of the eight authority
    responsibilities enumerated in 01. The Python control plane is
    the sole authority surface; an executor is, by construction, a
    bounded, capability-gated, audit-bracketed, replay-classified
    consumer of host-issued effect handles whose outputs enter the
    eight-stage signable path only as candidate material that the host
    re-validates host-side.

result_ingress_rule:
  governing_sections: [3.2, 3.3, 3.12, 7.3, 7.5, 22.5]
  default: candidate_material_until_host_admitted
  rule: |
    Bytes returned by any external executor are candidate material.
    They become admitted truth only after host-side re-validation,
    schema conformance, capability-token reconciliation, taint-graph
    intake, and replay classification (with explicit downgrade where
    any dimension is unsatisfied). Failure of any ingress invariant
    is a reject; partial satisfaction is a downgrade with
    DriftEventRecord; ambiguity is a defer. There is no implicit
    promotion path.

audit_and_replay_minimum:
  governing_sections: [22.1, 22.5, 23.12, 23.14, 23.19, 31]
  rule: |
    Every external executor invocation requires a paired
    AuditRecord(enter) and AuditRecord(exit) authored host-side, with
    the executor identity, version, base-image/engine hash, capability
    token id consumed, declared time/random/scheduler shim policy,
    exit class, bytes-returned digest, and downgrade flag and reason
    where applicable. ReplayAnchor is minted host-side only after the
    exit record is durable and the executor's contributions are
    re-validated host-side. No executor writes to the audit ledger;
    no executor mints ReplayAnchor; no executor authors any field of
    a CapabilityToken, ApprovalArtifact, Revision, SnapshotRoot, or
    DriftEventRecord.

reversibility_policy:
  governing_sections: [3.14, 27, 31]
  rule: |
    Honoring this boundary is a precondition to any per-candidate
    admission via phase2_promotion_gate. A future admission PR must
    name, in addition to the existing per-candidate evidence, the
    specific clauses of this boundary it conforms to and the specific
    boundary clause whose violation would demote the executor back
    to defer-pending-evidence. Boundary nonconformance is itself a
    sufficient demotion trigger.

